name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: repository-safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks history scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Repository safety
        shell: pwsh
        run: ./scripts/repository-safety.ps1
      - name: Documentation policy
        shell: pwsh
        run: ./scripts/docs-policy.ps1
      - name: Git whitespace policy
        shell: pwsh
        run: |
          $parent = git rev-parse --verify HEAD^ 2>$null
          if ($LASTEXITCODE -eq 0) {
            git diff --check HEAD^ HEAD
          }
          else {
            git diff-tree --check --root --no-commit-id -r HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  python-quality:
    name: python-quality
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.11.30
      - name: Sync locked environment
        shell: pwsh
        run: uv sync --frozen --all-groups
      - name: Format
        shell: pwsh
        run: uv run ruff format --check .
      - name: Lint
        shell: pwsh
        run: uv run ruff check .
      - name: Type check
        shell: pwsh
        run: uv run mypy neuroagent
      - name: Dependency audit
        shell: pwsh
        run: uv run pip-audit
      - name: Unit and integration tests
        shell: pwsh
        run: uv run pytest
      - name: Verify committed OpenAPI document
        shell: pwsh
        run: |
          uv run python scripts/export-openapi.py
          git diff --exit-code -- web/openapi.json

  frontend-quality:
    name: frontend-quality
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Verify generated API types
        working-directory: web
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.generated.ts
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Unit tests
        working-directory: web
        run: npm run test:coverage
      - name: Build
        working-directory: web
        run: npm run build
      - name: Mock browser E2E
        working-directory: web
        run: npm run test:e2e
      - name: Dependency audit
        working-directory: web
        run: npm audit --audit-level=high

  codeql:
    name: codeql
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.37.0
        with:
          languages: python,javascript-typescript
          queries: security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.37.0

  quality-gate:
    name: quality-gate
    if: always()
    needs: [repository-safety, python-quality, frontend-quality, codeql]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          $needs = $env:NEEDS_JSON | ConvertFrom-Json
          $failed = @($needs.PSObject.Properties | Where-Object {
            $_.Value.result -notin @('success', 'skipped')
          })
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Error "$($_.Name): $($_.Value.result)" }
            exit 1
          }
          Write-Host 'All required jobs passed.'
