[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rs-fmri-agent"
version = "0.1.0"
description = "Local-first, approval-gated rs-fMRI workflows for MATLAB and DPABI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Huang Qi" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "nibabel>=5.3,<6",
  "jsonschema>=4.25,<5",
  "openpyxl>=3.1,<4",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "scipy>=1.13,<2",
  "pypdf>=6,<7",
  "python-docx>=1.1,<2",
  "pyyaml>=6.0.2,<7",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
rsfmri-api = "neuroagent.api.main:main"
rsfmri-worker = "neuroagent.workflow.worker:main"

[project.optional-dependencies]
rag = ["langchain-chroma>=0.2,<2", "requests>=2.32,<3"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12.7,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["neuroagent"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "web", "runs", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
[tool.ruff.lint.per-file-ignores]
"neuroagent/api/routes.py" = ["E501"]
"neuroagent/application/ports.py" = ["E501"]
"neuroagent/application/services.py" = ["E501", "RUF001"]
"neuroagent/application/work_dialogue.py" = ["E501", "RUF001"]
"neuroagent/application/work_tools.py" = ["E501"]
"neuroagent/infrastructure/model_work_agent_router.py" = ["RUF001"]
"neuroagent/infrastructure/filesystem/workspace_files.py" = ["E501", "E702", "SIM102", "RUF001"]
"neuroagent/infrastructure/persistence/repository_mixins/workspace_assistant.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
# Historical documents are immutable; code blocks there are evidence, not active source.
exclude = ["docs/archive/**"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["tests", "web"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=neuroagent --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
markers = [
  "integration: integration tests using local mock infrastructure",
  "matlab_smoke: explicitly approved lightweight MATLAB smoke tests",
  "demodata_smoke: explicitly approved DemoData acceptance runs; needs local data and MATLAB",
]

[tool.coverage.run]
branch = true
source = ["neuroagent"]
# The 85% gate measures the default install. These modules are excluded because
# the default test environment cannot execute them meaningfully, not to raise a
# score after the fact:
# - retriever.py is a vendored optional-Chroma port enabled only by the `rag`
#   extra; the default environment has no Chroma index to query.
# - api/main.py and workflow/worker_main.py are process entrypoints exercised by
#   local smoke runs, not by unit tests.
# - directory_picker.py opens a native OS directory dialog.
omit = [
    "*/__init__.py",
    "neuroagent/retrieval/fmrianalysis/retriever.py",
    "neuroagent/api/main.py",
    "neuroagent/workflow/worker_main.py",
    "neuroagent/infrastructure/filesystem/directory_picker.py",
]
